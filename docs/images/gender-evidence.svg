<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Who is speaking to whom?</title>
  <desc id="desc">The English line "Are you ready?" does not say whether a man or a woman is spoken to. The addon adds evidence: the cast with genders, the same line in languages that mark gender, and the lines before. The model decides the speaker is male and the listener female, and writes the feminine form.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="898" height="468" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">Who is speaking to whom?</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#59636e">An invented example. English hides the gender; many languages cannot.</text>

  <!-- English line -->
  <rect x="24" y="186" width="200" height="86" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="124" y="218" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">"Are you ready?"</text>
  <text x="124" y="242" text-anchor="middle" font-size="12" fill="#59636e">English: no gender</text>
  <text x="124" y="258" text-anchor="middle" font-size="12" fill="#59636e">for "you"</text>

  <line x1="224" y1="229" x2="262" y2="229" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Evidence -->
  <text x="430" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#0969da">+ evidence, strongest first</text>

  <rect x="266" y="106" width="328" height="96" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="282" y="130" font-size="14" font-weight="700" fill="#1f2328">Same line, other languages</text>
  <text x="282" y="152" font-size="13" fill="#1f2328">Arabic</text>
  <text x="578" y="152" font-size="13" fill="#1f2328" direction="rtl" text-anchor="start">أنتِ مستعدة؟</text>
  <text x="282" y="172" font-size="13" fill="#1f2328">Traditional Chinese</text>
  <text x="578" y="172" font-size="13" fill="#1f2328" text-anchor="end">妳準備好了嗎？</text>
  <text x="282" y="192" font-size="13" fill="#1f2328">Spanish</text>
  <text x="578" y="192" font-size="13" fill="#1f2328" text-anchor="end">¿Estás lista?</text>

  <rect x="266" y="212" width="328" height="66" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="282" y="236" font-size="14" font-weight="700" fill="#1f2328">Cast</text>
  <text x="282" y="258" font-size="13" fill="#1f2328">Mira - female · Tomas - male</text>

  <rect x="266" y="288" width="328" height="66" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="282" y="312" font-size="14" font-weight="700" fill="#1f2328">Lines just before</text>
  <text x="282" y="334" font-size="13" fill="#1f2328">Tomas: "Mira, the train is here."</text>

  <line x1="594" y1="154" x2="652" y2="210" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="594" y1="245" x2="652" y2="232" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="594" y1="321" x2="652" y2="254" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Model -->
  <rect x="656" y="180" width="220" height="100" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
  <text x="766" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">The model decides first</text>
  <text x="766" y="234" text-anchor="middle" font-size="13" fill="#1f2328">speaker: male</text>
  <text x="766" y="254" text-anchor="middle" font-size="13" fill="#1f2328">listener: female</text>

  <line x1="766" y1="280" x2="766" y2="318" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="656" y="322" width="220" height="104" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/>
  <text x="766" y="348" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">then translates</text>
  <text x="674" y="372" font-size="13" fill="#1f2328">Hebrew</text>
  <text x="858" y="372" font-size="13" fill="#1f2328" direction="rtl" text-anchor="start">את מוכנה?</text>
  <text x="674" y="392" font-size="13" fill="#1f2328">Spanish</text>
  <text x="858" y="392" font-size="13" fill="#1f2328" text-anchor="end">¿Estás lista?</text>
  <text x="674" y="412" font-size="13" fill="#1f2328">Arabic</text>
  <text x="858" y="412" font-size="13" fill="#1f2328" direction="rtl" text-anchor="start">هل أنتِ مستعدة؟</text>

  <text x="430" y="392" text-anchor="middle" font-size="12" fill="#59636e">Nothing tells? The model is told to prefer</text>
  <text x="430" y="410" text-anchor="middle" font-size="12" fill="#59636e">wording that needs no gender, not to guess.</text>
</svg>
