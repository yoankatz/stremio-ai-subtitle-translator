<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">מי מדבר אל מי?</title>
  <desc id="desc">השורה באנגלית "Are you ready?" לא אומרת אם פונים לגבר או לאישה. התוסף מוסיף ראיות: הדמויות והמין שלהן, אותה שורה בשפות שמבדילות בין זכר לנקבה, והשורות שלפני. המודל מחליט שהדובר גבר והנמענת אישה, וכותב בלשון נקבה.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="898" height="468" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="450" y="40" text-anchor="middle" direction="rtl" font-size="22" font-weight="700" fill="#1f2328">מי מדבר אל מי?</text>
  <text x="450" y="62" text-anchor="middle" direction="rtl" font-size="13" fill="#59636e">דוגמה מומצאת. באנגלית לא רואים את המין; בהרבה שפות אי אפשר להסתיר אותו.</text>

  <!-- השורה באנגלית: מימין -->
  <rect x="676" y="186" width="200" height="86" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="776" y="218" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">"Are you ready?"</text>
  <text x="776" y="242" text-anchor="middle" direction="rtl" font-size="12" fill="#59636e">באנגלית "&#x2066;you&#x2069;" לא אומר</text>
  <text x="776" y="258" text-anchor="middle" direction="rtl" font-size="12" fill="#59636e">אם זה גבר או אישה</text>

  <line x1="676" y1="229" x2="638" y2="229" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ראיות -->
  <text x="470" y="94" text-anchor="middle" direction="rtl" font-size="14" font-weight="700" fill="#0969da">+ ראיות, החזקה ביותר קודם</text>

  <rect x="306" y="106" width="328" height="96" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="618" y="130" text-anchor="start" direction="rtl" font-size="14" font-weight="700" fill="#1f2328">אותה שורה בשפות אחרות</text>
  <text x="618" y="152" font-size="13" fill="#1f2328" direction="rtl" text-anchor="start">ערבית</text>
  <text x="322" y="152" font-size="13" fill="#1f2328" direction="rtl" text-anchor="end">أنتِ مستعدة؟</text>
  <text x="618" y="172" font-size="13" fill="#1f2328" direction="rtl" text-anchor="start">סינית מסורתית</text>
  <text x="322" y="172" font-size="13" fill="#1f2328">妳準備好了嗎？</text>
  <text x="618" y="192" font-size="13" fill="#1f2328" direction="rtl" text-anchor="start">ספרדית</text>
  <text x="322" y="192" font-size="13" fill="#1f2328">¿Estás lista?</text>

  <rect x="306" y="212" width="328" height="66" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="618" y="236" text-anchor="start" direction="rtl" font-size="14" font-weight="700" fill="#1f2328">הדמויות</text>
  <text x="618" y="258" text-anchor="start" direction="rtl" font-size="13" fill="#1f2328">מירה - אישה · תומס - גבר</text>

  <rect x="306" y="288" width="328" height="66" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="618" y="312" text-anchor="start" direction="rtl" font-size="14" font-weight="700" fill="#1f2328">השורות שלפני</text>
  <text x="618" y="334" text-anchor="start" direction="rtl" font-size="13" fill="#1f2328">תומס: "מירה, הרכבת כאן."</text>

  <line x1="306" y1="154" x2="248" y2="210" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="306" y1="245" x2="248" y2="232" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="306" y1="321" x2="248" y2="254" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- המודל: משמאל -->
  <rect x="24" y="180" width="220" height="100" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
  <text x="134" y="208" text-anchor="middle" direction="rtl" font-size="15" font-weight="700" fill="#1f2328">המודל מחליט קודם</text>
  <text x="134" y="234" text-anchor="middle" direction="rtl" font-size="13" fill="#1f2328">הדובר: גבר</text>
  <text x="134" y="254" text-anchor="middle" direction="rtl" font-size="13" fill="#1f2328">הנמענת: אישה</text>

  <line x1="134" y1="280" x2="134" y2="318" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- התוצאה -->
  <rect x="24" y="322" width="220" height="104" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/>
  <text x="134" y="348" text-anchor="middle" direction="rtl" font-size="14" font-weight="700" fill="#1f2328">ואז מתרגם</text>
  <text x="228" y="372" font-size="13" fill="#1f2328" direction="rtl" text-anchor="start">עברית</text>
  <text x="40" y="372" font-size="13" fill="#1f2328" direction="rtl" text-anchor="end">את מוכנה?</text>
  <text x="228" y="392" font-size="13" fill="#1f2328" direction="rtl" text-anchor="start">ספרדית</text>
  <text x="40" y="392" font-size="13" fill="#1f2328">¿Estás lista?</text>
  <text x="228" y="412" font-size="13" fill="#1f2328" direction="rtl" text-anchor="start">ערבית</text>
  <text x="40" y="412" font-size="13" fill="#1f2328" direction="rtl" text-anchor="end">هل أنتِ مستعدة؟</text>

  <text x="470" y="392" text-anchor="middle" direction="rtl" font-size="12" fill="#59636e">אין שום רמז? המודל מונחה להעדיף ניסוח</text>
  <text x="470" y="410" text-anchor="middle" direction="rtl" font-size="12" fill="#59636e">שלא דורש מין, ולא לנחש.</text>
</svg>
